<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel LAN Center</title>
<link rel="stylesheet" href="style.css">

<style>

.botones-qr{
display:flex;
gap:10px;
margin-top:10px;
}

.botones-qr button{

.zoom{

<body>

<!-- HEADER -->
<div class="header-premium">
<div class="top-logo">
<img src="logo.png" class="logo">
</div>
<h1 class="titulo">PANEL LAN CENTER JACKNNIEL</h1>
<h2 id="rolTexto" class="rol"></h2>
</div>

<hr>

<!-- MENÚ -->
<div class="menu-botones" id="menuCategorias"></div>

<br>

 <div id="panelDinamico"></div> 

<!-- PANEL PAGOS -->
<div id="pagosPanel" class="panel-seccion" style="display:none;">

<div id="listaPagos">⏳ Cargando métodos...</div>
</div>

<!-- PANEL PRECIOS -->
<div id="preciosPanel" class="panel-seccion" style="display:none;">

<input type="text"
id="buscadorPrecios"
class="buscador"
placeholder="🔍 Buscar..."
onkeyup="filtrarPrecios()">

<input type="text"
id="buscadorGaleria"
class="buscador"
placeholder="🔍 Buscar en galería..."
onkeyup="filtrarGaleria()">

</div>

<!-- PANEL MENSAJES -->

<h2 class="subtitulo">💬 MENSAJES RÁPIDOS</h2>

id="buscadorMensajes"
class="buscador"
placeholder="🔍 Buscar mensaje..."
onkeyup="filtrarMensajes()">

<br>

<button class="btn-salir" onclick="logout()">Salir</button>

<script>

// 🔒 LOGIN
let user = localStorage.getItem("user");
if (!user) window.location.href="login.html";

let rol = localStorage.getItem("rol");
document.getElementById("rolTexto").innerText =
"Usuario: "+user+" | Rol: "+rol;


// ===== CERRAR TODO =====

function cerrarTodo(){
document.getElementById("pagosPanel").style.display="none";
document.getElementById("preciosPanel").style.display="none";
document.getElementById("galeriaPanel").style.display="none";
document.getElementById("mensajesPanel").style.display="none";
}


// ===== MOSTRAR PAGOS =====

function mostrarPagos(){

let panel=document.getElementById("pagosPanel");

if(panel.style.display==="block"){
panel.style.display="none";
return;
}

cerrarTodo();
panel.style.display="block";
cargarPagos();
}


// ===== MOSTRAR PRECIOS =====

function mostrarPrecios(){

let panel=document.getElementById("preciosPanel");

if(panel.style.display==="block"){
panel.style.display="none";
return;
}

cerrarTodo();
panel.style.display="block";
cargarPrecios();
document.getElementById("buscadorPrecios").value="";
}


// ===== MOSTRAR GALERÍA =====

function mostrarGaleria(){

let panel=document.getElementById("galeriaPanel");

if(panel.style.display==="block"){
panel.style.display="none";
return;
}

cerrarTodo();
panel.style.display="block";
cargarGaleria();
document.getElementById("buscadorGaleria").value="";
}


function mostrarMensajes(){

let panel=document.getElementById("mensajesPanel");

if(panel.style.display==="block"){
panel.style.display="none";
return;
}

cerrarTodo();
panel.style.display="block";
cargarMensajes();
document.getElementById("buscadorMensajes").value="";
}


function toggleMensajes(cat){

let div=document.getElementById("msg-"+cat);

if(div.classList.contains("abierto")){
div.classList.remove("abierto");
div.style.maxHeight="0px";
return;
}

document.querySelectorAll("#listaMensajes .contenido").forEach(c=>{
c.classList.remove("abierto");
c.style.maxHeight="0px";
});

div.classList.add("abierto");
div.style.maxHeight=div.scrollHeight+"px";
}
  

// ===== PAGOS =====

async function cargarPagos(){

let contenedor=document.getElementById("listaPagos");

try{
const res=await fetch("pagos.txt?v="+new Date().getTime());
const texto=await res.text();

let partes=texto.split("###");
let html="";

for(let i=1;i<partes.length;i+=2){

let categoria=partes[i].trim();
let contenido=partes[i+1].trim();

html+=`<h2 class="subtitulo">${categoria}</h2><div class="grid">`;

// 🔥 SISTEMA INTELIGENTE (igual que mensajes rápidos)

let lineas = contenido.split("\n");

let nombreActual="";
let textoAcumulado="";

lineas.forEach(linea=>{

// Si la línea contiene |
if(linea.includes("|")){

// Mostrar bloque anterior si había texto
if(nombreActual && textoAcumulado){

html+=`
<div class="card-pro">
<h2>${nombreActual}</h2>
<div style="padding:15px;background:#111;border-radius:10px;margin-bottom:10px;white-space:pre-line;">
${textoAcumulado}
</div>
<div class="botones-qr">
<button class="btn-copy"
onclick="navigator.clipboard.writeText(\`${textoAcumulado}\`);mostrarMensaje('✅ Mensaje copiado');">
📋 Copiar
</button>
</div>
</div>
`;
}

// Reiniciar variables
let datos=linea.split("|");
nombreActual=datos[0].trim();
textoAcumulado=datos[1].trim();

// Si es imagen
if(textoAcumulado.match(/\.(png|jpg|jpeg|webp|gif)$/i)){

let id="qr-"+nombreActual.replaceAll(" ","");

html+=`
<div class="card-pro">
<h2>${nombreActual}</h2>
<img id="${id}" class="qr-img" src="${textoAcumulado}" onclick="zoomQR('${id}')">
<div class="botones-qr">
<button class="btn-copy" onclick="copiarQR('${id}')">📋 Copiar</button>
<button class="btn-download" onclick="descargarQR('${textoAcumulado}','${nombreActual}')">⬇ Descargar</button>
</div>
</div>
`;

nombreActual="";
textoAcumulado="";
}

}else{

// Línea adicional del mensaje
textoAcumulado += "\n" + linea;

}

});

// Mostrar último bloque pendiente
if(nombreActual && textoAcumulado){

html+=`
<div class="card-pro">
<h2>${nombreActual}</h2>
<div style="padding:15px;background:#111;border-radius:10px;margin-bottom:10px;white-space:pre-line;">
${textoAcumulado}
</div>
<div class="botones-qr">
<button class="btn-copy"
onclick="navigator.clipboard.writeText(\`${textoAcumulado}\`);mostrarMensaje('✅ Mensaje copiado');">
📋 Copiar
</button>
</div>
</div>
`;
}

html+=`</div>`;
}

contenedor.innerHTML=html;

}catch{
contenedor.innerHTML="<p style='color:red'>Error cargando pagos</p>";
}
}


// ===== PRECIOS =====

async function cargarPrecios(){

let contenedor=document.getElementById("listaPrecios");

try{
const res=await fetch("precios.txt?v="+new Date().getTime());
const texto=await res.text();

let partes=texto.split("###");
let html="";

for(let i=1;i<partes.length;i+=2){

let categoria=partes[i].trim();
let bloque=partes[i+1].trim();
let visible=bloque.replaceAll("\n","<br>");

html+=`
<div class="categoria">
<button class="btn-categoria" onclick="toggleCategoria('${categoria}')">
▶ ${categoria}
</button>
<div class="contenido" id="cat-${categoria}">
<div class="bloque-precio">
<div class="texto-precio">${visible}</div>
<button class="btn-copiar-todo"
onclick="copiarBloque(event,\`${bloque}\`)">
📋 Copiar Todo
</button>
</div>
</div>
</div>
`;
}

contenedor.innerHTML=html;

}catch{
contenedor.innerHTML="<p style='color:red'>Error cargando precios</p>";
}
}

async function cargarMensajes(){

let contenedor=document.getElementById("listaMensajes");
let html="";

html += await crearCategoriaMensajes("LAN CENTER JACKNNIEL","mensajes_lan.txt");

contenedor.innerHTML=html;

// 🔥 FUNCIÓN PARA CREAR CADA CATEGORÍA

 async function crearCategoriaMensajes(titulo,archivo){

let visible=titulo.replaceAll(" ","_");
let html="";

html+=`
<div class="categoria">
<button class="btn-categoria" onclick="toggleMensajes('${visible}')">
▶ ${titulo}
</button>

<div class="contenido" id="msg-${visible}">
<div class="grid">
`;

try{

const res=await fetch(archivo+"?v="+new Date().getTime());
const texto=await res.text();

let contenido=texto.trim();
let lineas=contenido.split("\n");

let nombreActual="";
let textoAcumulado="";

lineas.forEach(linea=>{

linea=linea.replace("\r","");

if(linea.includes("|")){

if(nombreActual && textoAcumulado){

let textoSeguro = textoAcumulado
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

html+=`
<div class="card-pro">
<h2>${nombreActual}</h2>
<div class="texto-pro">
${procesarTextoPro(textoSeguro)}
</div>

<div class="botones-qr">
<button class="btn-copy"
onclick="navigator.clipboard.writeText(\`${textoAcumulado}\`)">
📋 Copiar
</button>
</div>

</div>
`;
}

let partesLinea=linea.split("|");

nombreActual=partesLinea[0].trim();
textoAcumulado=partesLinea.slice(1).join("|").trim();

if(textoAcumulado.match(/\.(png|jpg|jpeg|webp|gif)$/i)){

let id="msgimg-"+nombreActual.replaceAll(" ","");

html+=`
<div class="card-pro">
<h2>${nombreActual}</h2>

<img id="${id}" class="qr-img"
src="${textoAcumulado}"
onclick="zoomQR('${id}')">

<div class="botones-qr">
<button class="btn-copy" onclick="copiarQR('${id}')">
📋 Copiar
</button>

<button class="btn-download"
onclick="descargarQR('${textoAcumulado}','${nombreActual}')">
⬇ Descargar
</button>
</div>

</div>
`;

nombreActual="";
textoAcumulado="";
}

}else{

textoAcumulado += "\n" + linea;

}

});

if(nombreActual && textoAcumulado){

let textoSeguro = textoAcumulado
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

html+=`
<div class="card-pro">

<h2>${nombreActual}</h2>

<div class="texto-pro">
${procesarTextoPro(textoSeguro)}
</div>

<div class="botones-qr">
<button class="btn-copy"
onclick="navigator.clipboard.writeText(\`${textoAcumulado}\`)">
📋 Copiar
</button>
</div>

</div>
`;
}

}catch{

html+=`<p style="color:red">Error cargando ${archivo}</p>`;

}

html+=`
</div>
</div>
</div>
`;

return html;

}

function procesarTexto(texto){

let lineas=texto.split("\n");
let resultado="";

lineas.forEach(l=>{

if(l.startsWith("#")){

resultado+=`<h3>${l.replace("#","")}</h3>`;

}else if(l.startsWith("•")){

resultado+=`<li>${l.replace("•","")}</li>`;

}else if(l.startsWith("[Botón]")){

let partes=l.replace("[Botón]","").split("|");

resultado+=`
<a href="${partes[1]}" target="_blank">
<button class="btn">
${partes[0]}
</button>
</a>
`;

}else if(l==="---"){

resultado+=`<hr>`;

}else{

resultado+=`<p>${l}</p>`;

}

});

return resultado;

}

 
function toggleCategoria(cat){

let div=document.getElementById("cat-"+cat);

if(div.classList.contains("abierto")){
div.classList.remove("abierto");
div.style.maxHeight="0px";
return;
}

document.querySelectorAll(".contenido").forEach(c=>{
c.classList.remove("abierto");
c.style.maxHeight="0px";
});

div.classList.add("abierto");
div.style.maxHeight=div.scrollHeight+"px";
}


function filtrarPrecios(){

let input = document.getElementById("buscadorPrecios").value.toLowerCase();

// 🔥 SUBIR AUTOMÁTICAMENTE ARRIBA
window.scrollTo({ top: 0, behavior: "smooth" });

let categorias = document.querySelectorAll("#listaPrecios .categoria");

// 🔹 SI ESTÁ VACÍO → VOLVER TODO NORMAL
if(input.trim() === ""){

categorias.forEach(cat=>{
cat.style.display = "block";

let contenido = cat.querySelector(".contenido");
contenido.classList.remove("abierto");
contenido.style.maxHeight = "0px";
});

window.scrollTo({ top: 0, behavior: "smooth" });
return;
}


// 🔹 FILTRAR CATEGORÍAS COMPLETAS
categorias.forEach(cat=>{

let textoCompleto = cat.innerText.toLowerCase();
let contenido = cat.querySelector(".contenido");

if(textoCompleto.includes(input)){

cat.style.display = "block";

// abrir automáticamente
contenido.classList.add("abierto");
contenido.style.maxHeight = contenido.scrollHeight + "px";

}else{

cat.style.display = "none";

}

});

window.scrollTo({ top: 0, behavior: "smooth" });

}

function filtrarMensajes(){

// 🔥 SCROLL AUTOMÁTICO AL BUSCAR
window.scrollTo({
top: document.getElementById("mensajesPanel").offsetTop - 20,
behavior: "smooth"
});

let input=document.getElementById("buscadorMensajes").value.toLowerCase();

// 🔹 SI ESTÁ VACÍO → VOLVER AL ESTADO ORIGINAL
if(input.trim()===""){

// Mostrar todas las tarjetas
document.querySelectorAll("#listaMensajes .card-pro").forEach(card=>{
card.style.display="block";
});

// Mostrar todas las categorías
document.querySelectorAll("#listaMensajes .categoria").forEach(cat=>{
cat.style.display="block";

// Cerrar todas las categorías
let contenido=cat.querySelector(".contenido");
contenido.classList.remove("abierto");
contenido.style.maxHeight="0px";
});

return;
}


// 🔹 FILTRAR TARJETAS
document.querySelectorAll("#listaMensajes .card-pro").forEach(card=>{

let texto=card.innerText.toLowerCase();

if(texto.includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}

});


// 🔹 OCULTAR CATEGORÍAS VACÍAS Y ABRIR LAS QUE TENGAN RESULTADOS
document.querySelectorAll("#listaMensajes .categoria").forEach(cat=>{

let tarjetas=cat.querySelectorAll(".card-pro");
let algunaVisible=false;

tarjetas.forEach(t=>{
if(t.style.display!=="none"){
algunaVisible=true;
}
});

if(algunaVisible){

cat.style.display="block";

let contenido=cat.querySelector(".contenido");
contenido.classList.add("abierto");
contenido.style.maxHeight=contenido.scrollHeight+"px";

}else{

cat.style.display="none";

}

});

}

// ===== UTIL =====

function copiarBloque(event,texto){
event.stopPropagation();
navigator.clipboard.writeText(texto);
mostrarMensaje("✅ Copiado");
}

function mostrarMensaje(msg){
let aviso=document.createElement("div");
aviso.innerText=msg;
aviso.className="toast";
document.body.appendChild(aviso);
setTimeout(()=>aviso.remove(),1800);
}

async function copiarQR(idImg){
let img=document.getElementById(idImg);
try{
const response=await fetch(img.src);
const blob=await response.blob();
await navigator.clipboard.write([
new ClipboardItem({[blob.type]:blob})
]);
mostrarMensaje("✅ Imagen copiada");
}catch{
mostrarMensaje("❌ No se pudo copiar");
}
}

function descargarQR(archivo,nombre){
let a=document.createElement("a");
a.href=archivo;
a.download=nombre+".png";
a.click();
}

function zoomQR(id){
document.getElementById(id).classList.toggle("zoom");
}

function logout(){
localStorage.clear();
window.location.href="login.html";
}

async function cargarCategorias(){

let menu = document.getElementById("menuCategorias");
let panel = document.getElementById("panelDinamico");

try{

const res = await fetch("categorias.txt?v="+new Date().getTime());
const texto = await res.text();

let lineas = texto.split("\n");

lineas.forEach(linea=>{

if(!linea.includes("|")) return;

let datos = linea.split("|");

let nombre = datos[0].trim();
let archivo = datos[1].trim();

let id = nombre.replaceAll(" ","_");

menu.innerHTML += `
<button class="btn" onclick="abrirCategoria('${id}','${archivo}','${nombre}')">
${nombre}
</button>
`;

panel.innerHTML += `
<div id="panel_${id}" class="panel-seccion" style="display:none;">
<h2 class="subtitulo">${nombre}</h2>

<input class="buscador"
placeholder="🔍 Buscar..."
onkeyup="buscarGeneral('${id}')">

<div id="contenido_${id}">⏳ Cargando...</div>
</div>
`;

});

}catch{

menu.innerHTML = "Error cargando categorias";

}

}

function abrirCategoria(id,archivo,titulo){

document.querySelectorAll(".panel-seccion").forEach(p=>{
p.style.display="none";
});

let panel = document.getElementById("panel_"+id);
panel.style.display="block";

cargarContenido(archivo,"contenido_"+id);

}

async function cargarContenido(archivo,contenedor){

let div = document.getElementById(contenedor);

try{

const res = await fetch(archivo+"?v="+new Date().getTime());
const texto = await res.text();

let html="";

let lineas = texto.split("\n");

lineas.forEach(linea=>{

if(!linea.includes("|")) return;

let datos = linea.split("|");

let nombre = datos[0].trim();
let valor = datos[1].trim();

if(valor.match(/\.(png|jpg|jpeg|webp|gif)$/i)){

let id="img_"+nombre.replaceAll(" ","");

html += `
<div class="card-pro">
<h2>${nombre}</h2>

<img id="${id}" class="qr-img"
src="${valor}"
onclick="zoomQR('${id}')">

<div class="botones-qr">

<button class="btn-copy"
onclick="copiarQR('${id}')">
📋 Copiar
</button>

<button class="btn-download"
onclick="descargarQR('${valor}','${nombre}')">
⬇ Descargar
</button>

</div>
</div>
`;

}else{

html += `
<div class="card-pro">
<h2>${nombre}</h2>

<div style="padding:15px;background:#111;border-radius:10px;white-space:pre-line;">
${valor}
</div>

<button class="btn-copy"
onclick="navigator.clipboard.writeText(\`${valor}\`);mostrarMensaje('Copiado');">
📋 Copiar
</button>

</div>
`;

}

});

div.innerHTML = html;

}catch{

div.innerHTML = "Error cargando archivo";

}

}

function buscarGeneral(id){

let input = event.target.value.toLowerCase();

let contenedor = document.getElementById("contenido_"+id);

contenedor.querySelectorAll(".card-pro").forEach(card=>{

let texto = card.innerText.toLowerCase();

if(texto.includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}

});

}

cargarCategorias();


 function procesarTextoPro(texto){

let lineas = texto.split("\n");
let resultado = "";

lineas.forEach(l=>{

l = l.trim();

if(l === ""){

resultado += "<br>";
return;

}

// TITULOS
if(l.startsWith("#")){
resultado += `<h3 style="color:yellow;margin-top:10px;">${l.replace("#","")}</h3>`;
return;
}

// LISTAS
if(l.startsWith("•")){
resultado += `<div style="margin-left:10px;">• ${l.replace("•","")}</div>`;
return;
}

// BOTONES
if(l.startsWith("[Boton]")){

let partes = l.replace("[Boton]","").split("|");

let textoBtn = partes[0].trim();
let link = partes[1].trim();

resultado += `
<a href="${link}" target="_blank">
<button class="btn" style="margin-top:10px;">
${textoBtn}
</button>
</a>
`;

return;
}

// SEPARADOR
if(l==="---"){
resultado += `<hr style="margin:10px 0;border:1px solid cyan;">`;
return;
}

// TEXTO NORMAL
resultado += `<div>${l}</div>`;

});

return resultado;

}
  
</script>
