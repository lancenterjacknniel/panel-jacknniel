<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel LAN Center</title>
<link rel="stylesheet" href="style.css">

<style>

.botones-qr{
display:flex;
gap:10px;
margin-top:10px;
}

.botones-qr button{
flex:1;
}

.zoom{
transform:scale(1.5);
z-index:1000;
position:relative;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header-premium">
<div class="top-logo">
<img src="logo.png" class="logo">
</div>

<h1 class="titulo">PANEL LAN CENTER JACKNNIEL</h1>
<h2 id="rolTexto" class="rol"></h2>

</div>

<hr>

<!-- MENU -->
<div class="menu-botones">

<button class="btn" onclick="abrirPanel('pagosPanel')">
💳 Métodos de Pago
</button>

<button class="btn" onclick="abrirPanel('preciosPanel');cargarPrecios()">
💰 Precios
</button>

<button class="btn" onclick="abrirPanel('galeriaPanel');cargarGaleria()">
🖼 Galería
</button>

<button class="btn" onclick="abrirPanel('mensajesPanel');cargarMensajes()">
💬 Mensajes Rápidos
</button>

</div>

<br>

<!-- PAGOS -->
<div id="pagosPanel" class="panel-seccion" style="display:none;">

<h2 class="subtitulo">💳 MÉTODOS DE PAGO</h2>

<div id="listaPagos">Cargando...</div>

</div>


<!-- PRECIOS -->
<div id="preciosPanel" class="panel-seccion" style="display:none;">

<h2 class="subtitulo">💰 Catálogo de Precios</h2>

<input
class="buscador"
id="buscadorPrecios"
placeholder="🔍 Buscar..."
onkeyup="filtrarPrecios()">

<div id="listaPrecios"></div>

</div>


<!-- GALERIA -->
<div id="galeriaPanel" class="panel-seccion" style="display:none;">

<h2 class="subtitulo">🖼 GALERÍA</h2>

<input
class="buscador"
id="buscadorGaleria"
placeholder="🔍 Buscar..."
onkeyup="filtrarGaleria()">

<div id="listaGaleria"></div>

</div>


<!-- MENSAJES -->
<div id="mensajesPanel" class="panel-seccion" style="display:none;">

<h2 class="subtitulo">💬 MENSAJES RÁPIDOS</h2>

<input
class="buscador"
id="buscadorMensajes"
placeholder="🔍 Buscar..."
onkeyup="filtrarMensajes()">

<div id="listaMensajes"></div>

</div>


<button class="btn-salir" onclick="logout()">Salir</button>

<script>

/* LOGIN */

let user = localStorage.getItem("user")

if(!user){
window.location.href="login.html"
}

document.getElementById("rolTexto").innerText="Usuario: "+user


/* ABRIR PANEL */

function abrirPanel(id){

document.querySelectorAll(".panel-seccion").forEach(p=>{
p.style.display="none"
})

document.getElementById(id).style.display="block"

}


/* PAGOS */

async function cargarPagos(){

let contenedor=document.getElementById("listaPagos")

const res=await fetch("pagos.txt?v="+Date.now())
const texto=await res.text()

let html=""

texto.split("\n").forEach(l=>{

if(!l.includes("|")) return

let d=l.split("|")

let nombre=d[0].trim()
let archivo=d[1].trim()

let id="img_"+nombre.replaceAll(" ","")

html+=`

<div class="card-pro">

<h2>${nombre}</h2>

<img
id="${id}"
class="qr-img"
src="${archivo}"
onclick="zoomQR('${id}')">

<div class="botones-qr">

<button class="btn-copy"
onclick="copiarQR('${id}')">
📋 Copiar
</button>

<button class="btn-download"
onclick="descargarQR('${archivo}','${nombre}')">
⬇ Descargar
</button>

</div>

</div>

`

})

contenedor.innerHTML=html

}


/* PRECIOS */

async function cargarPrecios(){

let contenedor=document.getElementById("listaPrecios")

const res=await fetch("precios.txt?v="+Date.now())
const texto=await res.text()

let partes=texto.split("###")

let html=""

for(let i=1;i<partes.length;i+=2){

let categoria=partes[i].trim()

let bloque=partes[i+1].trim()

html+=`

<div class="categoria">

<button
class="btn-categoria"
onclick="toggleCategoria('${categoria}')">

▶ ${categoria}

</button>

<div
class="contenido"
id="cat-${categoria}">

<div class="bloque-precio">

<div class="texto-precio">

${bloque.replaceAll("\n","<br>")}

</div>

<button
class="btn-copiar-todo"
onclick="navigator.clipboard.writeText(\`${bloque}\`)">

📋 Copiar Todo

</button>

</div>

</div>

</div>

`

}

contenedor.innerHTML=html

}


/* MENSAJES */

async function cargarMensajes(){

let contenedor=document.getElementById("listaMensajes")

let html=""

html+=await crearCategoriaMensajes(
"LAN CENTER JACKNNIEL",
"mensajes_lan.txt"
)

html+=await crearCategoriaMensajes(
"GAME LOAD BOLIVIA",
"mensajes_game.txt"
)

contenedor.innerHTML=html

}


/* CREAR CATEGORIA MENSAJES */

async function crearCategoriaMensajes(titulo,archivo){

let id=titulo.replaceAll(" ","_")

let html=`

<div class="categoria">

<button
class="btn-categoria"
onclick="toggleCategoria('msg_${id}')">

▶ ${titulo}

</button>

<div
class="contenido"
id="msg_${id}">

<div class="grid">

`

const res=await fetch(archivo+"?v="+Date.now())
const texto=await res.text()

let lineas=texto.split("\n")

lineas.forEach(l=>{

if(!l.includes("|")) return

let d=l.split("|")

let nombre=d[0].trim()
let valor=d[1].trim()

if(valor.match(/\.(png|jpg|jpeg|webp|gif)$/i)){

let img="img_"+nombre.replaceAll(" ","")

html+=`

<div class="card-pro">

<h2>${nombre}</h2>

<img
id="${img}"
class="qr-img"
src="${valor}"
onclick="zoomQR('${img}')">

<div class="botones-qr">

<button class="btn-copy"
onclick="copiarQR('${img}')">
📋 Copiar
</button>

<button class="btn-download"
onclick="descargarQR('${valor}','${nombre}')">
⬇ Descargar
</button>

</div>

</div>

`

}else{

html+=`

<div class="card-pro">

<h2>${nombre}</h2>

<div style="
padding:15px;
background:#111;
border-radius:10px;
white-space:pre-line;
">

${valor}

</div>

<button
class="btn-copy"
onclick="navigator.clipboard.writeText(\`${valor}\`)">

📋 Copiar

</button>

</div>

`

}

})

html+=`

</div>
</div>
</div>

`

return html

}


/* BUSCADORES */

function filtrarMensajes(){

let input=document.getElementById("buscadorMensajes").value.toLowerCase()

document.querySelectorAll("#listaMensajes .card-pro").forEach(card=>{

let texto=card.innerText.toLowerCase()

card.style.display=
texto.includes(input) ? "block":"none"

})

}


function filtrarGaleria(){

let input=document.getElementById("buscadorGaleria").value.toLowerCase()

document.querySelectorAll("#listaGaleria .card-pro").forEach(card=>{

let texto=card.innerText.toLowerCase()

card.style.display=
texto.includes(input) ? "block":"none"

})

}


function filtrarPrecios(){

let input=document.getElementById("buscadorPrecios").value.toLowerCase()

document.querySelectorAll("#listaPrecios .categoria").forEach(cat=>{

let texto=cat.innerText.toLowerCase()

cat.style.display=
texto.includes(input) ? "block":"none"

})

}


/* UTILIDADES */

function toggleCategoria(id){

let div=document.getElementById(id)

if(div.style.maxHeight){
div.style.maxHeight=null
}else{
div.style.maxHeight=div.scrollHeight+"px"
}

}

async function copiarQR(id){

let img=document.getElementById(id)

const res=await fetch(img.src)

const blob=await res.blob()

await navigator.clipboard.write([
new ClipboardItem({[blob.type]:blob})
])

mostrarMensaje("Imagen copiada")

}

function descargarQR(url,nombre){

let a=document.createElement("a")

a.href=url
a.download=nombre+".png"

a.click()

}

function zoomQR(id){

document.getElementById(id)
.classList.toggle("zoom")

}

function mostrarMensaje(txt){

let aviso=document.createElement("div")

aviso.innerText=txt
aviso.className="toast"

document.body.appendChild(aviso)

setTimeout(()=>aviso.remove(),1500)

}

function logout(){

localStorage.clear()

window.location.href="login.html"

}

</script>

</body>
</html>
